services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalogo}
      POSTGRES_USER: ${POSTGRES_USER:-catalogo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-clave-local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://catalogo:cambiar-clave-local@db:5432/catalogo}
      SESSION_SECRET: ${SESSION_SECRET:-desarrollo-local-cambiar-esta-clave}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin-Demo-2026!}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-Consulta-Demo-2026!}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      BASE_URL: http://app:8000
      CI: "1"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
