<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Catálogo de Servicios</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <section id="login" class="card login">
      <h1>Catálogo de Servicios</h1>
      <p class="muted">Autenticación local</p>
      <form id="loginForm">
        <label for="loginInput">Usuario o correo</label
        ><input id="loginInput" name="login" autocomplete="username" required />
        <label for="passwordInput">Contraseña</label
        ><input
          id="passwordInput"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <p><button>Iniciar sesión</button></p>
      </form>
      <div id="loginMsg"></div>
    </section>
    <main id="app" class="hidden">
      <header>
        <h1>Catálogo de Servicios TI</h1>
        <span
          ><b id="who"></b> ·
          <button id="logout" class="secondary">Salir</button></span
        >
      </header>
      <div class="shell">
        <nav id="nav">
          <button data-view="services">Servicios</button
          ><button data-view="tickets">Tickets</button
          ><button data-view="cmdb">CMDB</button
          ><button data-view="dashboard">Tablero</button
          ><button data-view="knowledge">Autoservicio</button
          ><button data-view="queues" class="admin">Colas</button
          ><button data-view="org" class="admin">Organización</button
          ><button data-view="users" class="admin">Usuarios</button
          ><button data-view="catalogs" class="admin">Catálogos</button
          ><button data-view="imports">Importaciones</button>
        </nav>
        <div id="msg"></div>
        <section id="content"></section>
      </div>
    </main>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div class="modal-panel">
        <div class="modal-header">
          <h2 id="modalTitle"></h2>
          <button id="modalClose" type="button" class="secondary modal-close" aria-label="Cerrar">×</button>
        </div>
        <div id="modalMessage"></div>
        <div id="modalBody"></div>
      </div>
    </dialog>
    <script>
      let me = null,
        csrf = "",
        state = { page: 1 };
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
      async function api(url, opt = {}) {
        opt.headers = {
          ...(opt.body ? { "Content-Type": "application/json" } : {}),
          ...(opt.method && opt.method !== "GET"
            ? { "X-CSRF-Token": csrf }
            : {}),
          ...opt.headers,
        };
        let r = await fetch(url, opt);
        let data = await r.json().catch(() => ({ detail: r.statusText }));
        if (!r.ok)
          throw Error(
            Array.isArray(data.detail)
              ? data.detail.map((x) => x.msg).join(", ")
              : data.detail || "Error",
          );
        return data;
      }
      function message(t, ok = false) {
        $("#msg").innerHTML = t
          ? `<p class="${ok ? "success" : "error"}">${esc(t)}</p>`
            : "";
      }
      function modalMessage(t, ok = false) {
        $("#modalMessage").innerHTML = t
          ? `<p class="${ok ? "success" : "error"}">${esc(t)}</p>`
          : "";
      }
      function openModal(title, body) {
        $("#modalTitle").textContent = title;
        $("#modalBody").innerHTML = body;
        modalMessage("");
        if (!$("#modal").open) $("#modal").showModal();
      }
      function closeModal() {
        if ($("#modal").open) $("#modal").close();
        $("#modalBody").innerHTML = "";
        modalMessage("");
      }
      $("#modalClose").onclick = closeModal;
      $("#modal").onclick = (event) => {
        if (event.target === $("#modal")) closeModal();
      };
      $("#loginForm").onsubmit = async (e) => {
        e.preventDefault();
        try {
          me = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify(Object.fromEntries(new FormData(e.target))),
          });
          start();
        } catch (x) {
          $("#loginMsg").innerHTML = `<p class="error">${esc(x.message)}</p>`;
        }
      };
      async function session() {
        try {
          me = await api("/api/me");
          start();
        } catch {}
      }
      function start() {
        csrf = me.csrf;
        $("#login").classList.add("hidden");
        $("#app").classList.remove("hidden");
        $("#who").textContent = `${me.nombre} (${me.rol})`;
        document
          .querySelectorAll(".admin")
          .forEach((x) =>
            x.classList.toggle("hidden", me.rol !== "administrador"),
          );
        show("services");
      }
      $("#logout").onclick = async () => {
        await api("/api/auth/logout", { method: "POST" });
        location.reload();
      };
      $("#nav").onclick = (e) => {
        if (e.target.dataset.view) show(e.target.dataset.view);
      };
      async function show(view) {
        message("");
        document
          .querySelectorAll("nav button")
          .forEach((x) =>
            x.classList.toggle("active", x.dataset.view === view),
          );
        $("#content").innerHTML = '<div class="card"><p>Cargando…</p></div>';
        try {
          await (({ services, tickets, cmdb, dashboard, knowledge, queues, org, users, catalogs, imports })[view] || services)();
        } catch (error) {
          message(error.message || "No fue posible cargar la sección");
          $("#content").innerHTML = '<div class="card"><p>No fue posible cargar los datos.</p></div>';
        }
      }
      async function services() {
        let [data, n1, cl, cr, ty] = await Promise.all([
          api(`/api/servicios?page=${state.page}&size=15&${state.query || ""}`),
          api("/api/servicios/nivel1"),
          api("/api/catalogos/clases"),
          api("/api/catalogos/criticidades"),
          api("/api/catalogos/tipos"),
        ]);
        let options = (a) =>
          '<option value="">—</option>' +
          a
            .map(
              (x) =>
                `<option value="${x.id}">${esc(x.codigo)} · ${esc(x.nombre)}</option>`,
            )
            .join("");
        $("#content").innerHTML =
          `<div class="card"><h2>Servicios</h2><form id="filter" class="grid"><div><label>Código o nombre</label><input name="q"></div><div><label>Nivel 1</label><select name="nivel1_id">${options(n1)}</select></div><div><label>Clase</label><select name="clase_id">${options(cl)}</select></div><div><label>Criticidad</label><select name="criticidad_id">${options(cr)}</select></div><div><label>Tipo</label><select name="tipo_id">${options(ty)}</select></div><div class="actions"><button>Buscar</button>${me.rol === "administrador" ? '<button type="button" id="newSvc">Nuevo</button><button type="button" class="secondary" id="manageN1">Niveles 1</button>' : ""}</div></form></div><div class="card"><p>${data.total} resultados · página ${data.page}/${data.pages || 1}</p><table><thead><tr><th>Código</th><th>Nombre</th><th>Nivel 1</th><th>Clase</th><th>Estado</th><th></th></tr></thead><tbody>${data.items.map((x) => `<tr><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td>${esc(x.nivel1)}</td><td>${esc(x.clase || "Desconocida")}</td><td><span class="badge">${x.activo ? "Activo" : "Inactivo"}</span></td><td><button class="secondary detail" data-id="${x.id}">Ver</button></td></tr>`).join("")}</tbody></table><p class="actions"><button id="prev" ${data.page <= 1 ? "disabled" : ""}>Anterior</button><button id="next" ${data.page >= data.pages ? "disabled" : ""}>Siguiente</button></p></div>`;
        const statusFilter = document.createElement("div");
        statusFilter.innerHTML = '<label>Estado</label><select name="activo"><option value="true">Activos</option><option value="false">Inactivos</option></select>';
        $("#filter").insertBefore(statusFilter, $("#filter").lastElementChild);
        $("#filter").onsubmit = (e) => {
          e.preventDefault();
          state.page = 1;
          const params = new URLSearchParams();
          for (const [key, value] of new FormData(e.target).entries()) {
            if (String(value).trim() !== "") params.set(key, value);
          }
          state.query = params.toString();
          services();
        };
        $("#prev").onclick = () => {
          state.page--;
          services();
        };
        $("#next").onclick = () => {
          state.page++;
          services();
        };
        document
          .querySelectorAll(".detail")
          .forEach((b) => (b.onclick = () => serviceDetail(b.dataset.id)));
        if ($("#newSvc"))
          $("#newSvc").onclick = () => serviceForm(null, { n1, cl, cr, ty });
        if ($("#manageN1")) $("#manageN1").onclick = () => level1Manager();
      }
      async function serviceDetail(id) {
        let x = await api("/api/servicios/" + id);
        $("#content").innerHTML =
          `<div class="card"><h2>${esc(x.codigo)} · ${esc(x.nombre)}</h2><div class="grid"><p><b>Código original:</b> ${esc(x.codigo_original || "—")}</p><p><b>Nivel 1:</b> ${esc(x.nivel1)}</p><p><b>Estado operativo:</b> ${x.activo ? "Activo" : "Inactivo"}</p><p><b>Activo Excel:</b> ${esc(x.indicador_activo_excel || "Desconocido")}</p><p><b>Clase:</b> ${esc(x.clase || "Desconocida")}</p><p><b>Criticidad:</b> ${esc(x.criticidad || "Desconocida")}</p><p><b>Tipo:</b> ${esc(x.tipo || "Desconocido")}</p><p><b>Métrica:</b> ${esc(x.metrica || "Desconocida")}</p><p><b>Rango:</b> ${esc(x.minimo ?? "—")} – ${esc(x.maximo ?? "—")}</p><p><b>Revisión:</b> ${esc(x.estado_revision)}</p><p><b>Sección responsable:</b> ${esc(x.seccion_responsable || "Sin asignar")}</p><p><b>Usuario responsable:</b> ${esc(x.usuario_responsable || "Sin asignar")}</p><p><b>Origen:</b> ${esc(x.origen_hoja || "—")} · fila ${esc(x.origen_fila ?? "—")} · ${esc(x.origen_rango || "sin rango")}</p></div><p><b>Descripción:</b> ${esc(x.descripcion || "Sin descripción")}</p><div class="actions"><button id="backServices">Volver</button>${me.rol === "administrador" ? `<button id="edit">Editar</button><button id="toggle" class="danger">${x.activo ? "Desactivar" : "Activar"}</button>` : ""}</div></div>`;
        $("#backServices").onclick = () => services();
        if ($("#edit")) {
          $("#edit").onclick = async () => serviceForm(x);
          $("#toggle").onclick = async () => {
            try {
              await api("/api/servicios/" + x.id, {
                method: "PATCH",
                body: JSON.stringify({ activo: !x.activo }),
              });
              message("Estado actualizado", true);
              services();
            } catch (e) {
              message(e.message);
            }
          };
        }
      }
      async function level1Manager(editing = null) {
        const items = await api("/api/servicios/nivel1?include_inactive=true");
        openModal(
          "Servicios Nivel 1",
          `<form id="level1Form" class="grid"><div><label>Código</label><input name="codigo" value="${esc(editing?.codigo || "")}" required></div><div><label>Nombre</label><input name="nombre" value="${esc(editing?.nombre || "")}" required></div><div class="actions"><button>${editing ? "Guardar cambios" : "Crear"}</button>${editing ? '<button type="button" id="cancelLevel1Edit" class="secondary">Cancelar edición</button>' : ""}</div></form><table><thead><tr><th>Código</th><th>Nombre</th><th>Estado</th><th></th></tr></thead><tbody>${items.map((item) => `<tr><td>${esc(item.codigo)}</td><td>${esc(item.nombre)}</td><td>${item.activo ? "Activo" : "Inactivo"}</td><td><button type="button" class="secondary editLevel1" data-id="${item.id}">Editar</button> <button type="button" class="danger toggleLevel1" data-id="${item.id}" data-active="${item.activo}">${item.activo ? "Desactivar" : "Activar"}</button></td></tr>`).join("")}</tbody></table>`,
        );
        if ($("#cancelLevel1Edit")) $("#cancelLevel1Edit").onclick = () => level1Manager();
        $("#level1Form").onsubmit = async (event) => {
          event.preventDefault();
          const data = Object.fromEntries(new FormData(event.target));
          try {
            await api(editing ? `/api/servicios/nivel1/${editing.id}` : "/api/servicios/nivel1", {
              method: editing ? "PATCH" : "POST",
              body: JSON.stringify(data),
            });
            await level1Manager();
            modalMessage(editing ? "Nivel 1 actualizado" : "Nivel 1 creado", true);
          } catch (error) { modalMessage(error.message); }
        };
        document.querySelectorAll(".editLevel1").forEach((button) => {
          button.onclick = () => level1Manager(items.find((item) => item.id === +button.dataset.id));
        });
        document.querySelectorAll(".toggleLevel1").forEach((button) => {
          button.onclick = async () => {
            try {
              await api(`/api/servicios/nivel1/${button.dataset.id}`, {
                method: "PATCH", body: JSON.stringify({ activo: button.dataset.active !== "true" }),
              });
              await level1Manager();
              modalMessage("Estado actualizado", true);
            } catch (error) { modalMessage(error.message); }
          };
        });
      }
      async function serviceForm(x, lists) {
        lists = lists || {
          n1: await api("/api/servicios/nivel1"),
          cl: await api("/api/catalogos/clases"),
          cr: await api("/api/catalogos/criticidades"),
          ty: await api("/api/catalogos/tipos"),
        };
        lists.sec = lists.sec || await api("/api/organizacion/secciones");
        lists.us = lists.us || await api("/api/usuarios");
        let opts = (a, v) =>
          '<option value="">—</option>' +
          a
            .map(
              (i) =>
                `<option value="${i.id}" ${i.id === v ? "selected" : ""}>${esc(i.nombre)}</option>`,
            )
            .join("");
        openModal(
          x ? "Editar servicio" : "Nuevo servicio",
          `<form id="svc" class="grid"><div><label>Código</label><input name="codigo" value="${esc(x?.codigo || "")}" required></div><div><label>Nombre</label><input name="nombre" value="${esc(x?.nombre || "")}" required></div><div><label>Nivel 1</label><select name="nivel1_id" required>${opts(lists.n1, x?.nivel1_id)}</select></div><div><label>Activo en Excel</label><input name="indicador_activo_excel" value="${esc(x?.indicador_activo_excel || "")}"></div><div><label>Clase</label><select name="clase_id">${opts(lists.cl, x?.clase_id)}</select></div><div><label>Criticidad</label><select name="criticidad_id">${opts(lists.cr, x?.criticidad_id)}</select></div><div><label>Tipo</label><select name="tipo_id">${opts(lists.ty, x?.tipo_id)}</select></div><div><label>Métrica</label><input name="metrica" value="${esc(x?.metrica || "")}"></div><div><label>Mínimo</label><input type="number" step="any" name="minimo" value="${esc(x?.minimo || "")}"></div><div><label>Máximo</label><input type="number" step="any" name="maximo" value="${esc(x?.maximo || "")}"></div><div><label>Estado revisión</label><select name="estado_revision"><option>completo</option><option ${x?.estado_revision === "pendiente" ? "selected" : ""}>pendiente</option></select></div><div><label>Descripción</label><textarea name="descripcion">${esc(x?.descripcion || "")}</textarea></div><div class="actions"><button>Guardar</button><button id="cancelService" type="button" class="secondary">Cancelar</button></div></form>`,
        );
        const assignment = document.createElement("div");
        assignment.innerHTML = `<label>Sección responsable</label><select name="seccion_responsable_id">${opts(lists.sec, x?.seccion_responsable_id)}</select><label>Usuario responsable</label><select name="usuario_responsable_id">${opts(lists.us, x?.usuario_responsable_id)}</select>`;
        $("#svc").insertBefore(assignment, $("#svc").lastElementChild);
        $("#cancelService").onclick = closeModal;
        $("#svc").onsubmit = async (e) => {
          e.preventDefault();
          let d = Object.fromEntries(new FormData(e.target));
          ["nivel1_id", "clase_id", "criticidad_id", "tipo_id", "seccion_responsable_id", "usuario_responsable_id"].forEach(
            (k) => (d[k] = d[k] ? +d[k] : null),
          );
          ["minimo", "maximo"].forEach(
            (k) => (d[k] = d[k] === "" ? null : d[k]),
          );
          try {
            await api(x ? "/api/servicios/" + x.id : "/api/servicios", {
              method: x ? "PATCH" : "POST",
              body: JSON.stringify(d),
            });
            closeModal();
            message("Servicio guardado", true);
            services();
          } catch (er) {
            modalMessage(er.message);
          }
        };
      }
      async function org() {
        let kinds = [
            "empresas",
            "areas",
            "departamentos",
            "secciones",
            "puestos",
          ],
          labels = [
            "Empresas",
            "Áreas",
            "Departamentos",
            "Secciones",
            "Puestos",
          ];
        let all = {};
        for (let k of kinds)
          all[k] = await api(`/api/organizacion/${k}?include_inactive=true`);
        $("#content").innerHTML =
          `<div class="card"><h2>Organización</h2><label>Entidad</label><select id="kind">${kinds.map((k, i) => `<option value="${k}">${labels[i]}</option>`).join("")}</select></div><div id="orgbody"></div>`;
        let render = () => {
          let k = $("#kind").value,
            i = kinds.indexOf(k),
            parent = i ? all[kinds[i - 1]] : [];
          $("#orgbody").innerHTML =
            `<div class="card"><form id="orgform" class="grid"><div><label>Código</label><input name="codigo" required></div><div><label>Nombre</label><input name="nombre" required></div>${
              i
                ? `<div><label>Padre</label><select name="parent_id" required>${parent
                    .filter((x) => x.activo)
                    .map(
                      (x) =>
                        `<option value="${x.id}">${esc(x.codigo)} · ${esc(x.nombre)}</option>`,
                    )
                    .join("")}</select></div>`
                : ""
            }<div class="actions"><button>Crear</button></div></form><table><thead><tr><th>Código</th><th>Nombre</th><th>Estado</th><th></th></tr></thead><tbody>${all[k].map((x) => `<tr><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td>${x.activo ? "Activo" : "Inactivo"}</td><td><button data-id="${x.id}" data-active="${x.activo}" class="toggle danger">${x.activo ? "Desactivar" : "Activar"}</button></td></tr>`).join("")}</tbody></table></div>`;
          $("#orgform").onsubmit = async (e) => {
            e.preventDefault();
            let d = Object.fromEntries(new FormData(e.target));
            if (d.parent_id) d.parent_id = +d.parent_id;
            try {
              await api("/api/organizacion/" + k, {
                method: "POST",
                body: JSON.stringify(d),
              });
              org();
            } catch (er) {
              message(er.message);
            }
          };
          document.querySelectorAll(".toggle").forEach(
            (b) =>
              (b.onclick = async () => {
                try {
                  await api(`/api/organizacion/${k}/${b.dataset.id}`, {
                    method: "PATCH",
                    body: JSON.stringify({
                      activo: b.dataset.active !== "true",
                    }),
                  });
                  org();
                } catch (er) {
                  message(er.message);
                }
              }),
          );
          document.querySelectorAll(".toggle").forEach((button, index) => {
            const edit = document.createElement("button");
            edit.className = "secondary";
            edit.textContent = "Editar";
            edit.onclick = async () => {
              const current = all[k][index];
              const parentField = i
                ? `<div><label>Padre</label><select name="parent_id" required>${parent.filter(x => x.activo).map(x => `<option value="${x.id}" ${x.id === current.parent_id ? "selected" : ""}>${esc(x.codigo)} · ${esc(x.nombre)}</option>`).join("")}</select></div>`
                : "";
              openModal(
                `Editar ${labels[i].slice(0, -1)}`,
                `<form id="editOrg" class="grid"><div><label>Código</label><input name="codigo" value="${esc(current.codigo)}" required></div><div><label>Nombre</label><input name="nombre" value="${esc(current.nombre)}" required></div>${parentField}<div class="actions"><button>Guardar</button><button id="cancelEditOrg" type="button" class="secondary">Cancelar</button></div></form>`,
              );
              $("#cancelEditOrg").onclick = closeModal;
              $("#editOrg").onsubmit = async (event) => {
                event.preventDefault();
                const data = Object.fromEntries(new FormData(event.target));
                if (data.parent_id) data.parent_id = +data.parent_id;
                try {
                  await api(`/api/organizacion/${k}/${current.id}`, {
                    method: "PATCH", body: JSON.stringify(data),
                  });
                  closeModal();
                  await org();
                  message("Registro actualizado", true);
                } catch (error) { modalMessage(error.message); }
              };
            };
            button.parentElement.prepend(edit);
          });
        };
        $("#kind").onchange = render;
        render();
      }
      async function users() {
        let [us, pos] = await Promise.all([
          api("/api/usuarios?include_inactive=true"),
          api("/api/organizacion/puestos"),
        ]);
        $("#content").innerHTML =
          `<div class="card"><h2>Usuarios</h2><form id="userform" class="grid"><div><label>Nombre</label><input name="nombre" required></div><div><label>Login/correo</label><input name="login" required></div><div><label>Contraseña (mínimo 10)</label><input type="password" name="password" minlength="10" required></div><div><label>Rol</label><select name="rol"><option value="consulta">Consulta</option><option value="administrador">Administrador</option></select></div><div><label>Puesto</label><select name="puesto_id"><option value="">Sin asignar</option>${pos.map((x) => `<option value="${x.id}">${esc(x.nombre)}</option>`)}</select></div><div class="actions"><button>Crear</button></div></form><table><thead><tr><th>Login</th><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>${us.map((x) => `<tr><td>${esc(x.login)}</td><td>${esc(x.nombre)}</td><td>${esc(x.rol)}</td><td>${x.activo ? "Activo" : "Inactivo"}</td><td><button class="utoggle danger" data-id="${x.id}" data-active="${x.activo}">${x.activo ? "Desactivar" : "Activar"}</button></td></tr>`).join("")}</tbody></table></div>`;
        $("#userform").onsubmit = async (e) => {
          e.preventDefault();
          let d = Object.fromEntries(new FormData(e.target));
          d.puesto_id = d.puesto_id ? +d.puesto_id : null;
          try {
            await api("/api/usuarios", {
              method: "POST",
              body: JSON.stringify(d),
            });
            users();
          } catch (er) {
            message(er.message);
          }
        };
        document.querySelectorAll(".utoggle").forEach(
          (b) =>
            (b.onclick = async () => {
              try {
                await api("/api/usuarios/" + b.dataset.id, {
                  method: "PATCH",
                  body: JSON.stringify({ activo: b.dataset.active !== "true" }),
                });
                users();
              } catch (er) {
                message(er.message);
              }
              }),
        );
        document.querySelectorAll(".utoggle").forEach((button, index) => {
          const edit = document.createElement("button");
          edit.className = "secondary";
          edit.textContent = "Editar";
          edit.onclick = async () => {
            const current = us[index];
            openModal(
              "Editar usuario",
              `<form id="editUser" class="grid"><div><label>Nombre</label><input name="nombre" value="${esc(current.nombre)}" required></div><div><label>Login/correo</label><input name="login" value="${esc(current.login)}" required></div><div><label>Nueva contraseña</label><input type="password" name="password" minlength="10" placeholder="Dejar vacía para conservar"></div><div><label>Rol</label><select name="rol"><option value="consulta" ${current.rol === "consulta" ? "selected" : ""}>Consulta</option><option value="administrador" ${current.rol === "administrador" ? "selected" : ""}>Administrador</option></select></div><div><label>Puesto</label><select name="puesto_id"><option value="">Sin asignar</option>${pos.map(p => `<option value="${p.id}" ${p.id === current.puesto_id ? "selected" : ""}>${esc(p.nombre)}</option>`).join("")}</select></div><div class="actions"><button>Guardar</button><button id="cancelEditUser" type="button" class="secondary">Cancelar</button></div></form>`,
            );
            $("#cancelEditUser").onclick = closeModal;
            $("#editUser").onsubmit = async (event) => {
              event.preventDefault();
              const data = Object.fromEntries(new FormData(event.target));
              data.puesto_id = data.puesto_id ? +data.puesto_id : null;
              if (!data.password) delete data.password;
              try {
                await api(`/api/usuarios/${current.id}`, {
                  method: "PATCH", body: JSON.stringify(data),
                });
                closeModal();
                await users();
                message("Usuario actualizado", true);
              } catch (error) { modalMessage(error.message); }
            };
          };
          button.parentElement.prepend(edit);
        });
      }
      async function catalogs() {
        let kinds = ["clases", "criticidades", "tipos"];
        let all = {};
        for (let k of kinds)
          all[k] = await api(`/api/catalogos/${k}?include_inactive=true`);
        $("#content").innerHTML =
          `<div class="card"><h2>Catálogos controlados</h2><label>Catálogo</label><select id="catkind">${kinds.map((k) => `<option>${k}</option>`)}</select></div><div id="catbody"></div>`;
        let render = () => {
          let k = $("#catkind").value;
          $("#catbody").innerHTML =
            `<div class="card"><form id="catform" class="grid"><div><label>Código</label><input name="codigo" required></div><div><label>Nombre</label><input name="nombre" required></div><div class="actions"><button>Crear</button></div></form><table>${all[k].map((x) => `<tr><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td>${x.activo ? "Activo" : "Inactivo"}</td></tr>`).join("")}</table></div>`;
          $("#catform").onsubmit = async (e) => {
            e.preventDefault();
            try {
              await api("/api/catalogos/" + k, {
                method: "POST",
                body: JSON.stringify(
                  Object.fromEntries(new FormData(e.target)),
                ),
              });
              catalogs();
            } catch (er) {
              message(er.message);
            }
          };
          $("#catbody").querySelectorAll("tr").forEach((tr, index) => {
            const current = all[k][index];
            const cell = document.createElement("td");
            const toggle = document.createElement("button");
            toggle.className = "danger";
            toggle.textContent = current.activo ? "Desactivar" : "Activar";
            toggle.onclick = async () => {
              try {
                await api(`/api/catalogos/${k}/${current.id}`, {
                  method: "PATCH", body: JSON.stringify({ activo: !current.activo }),
                });
                catalogs();
              } catch (error) { message(error.message); }
            };
            const edit = document.createElement("button");
            edit.className = "secondary";
            edit.textContent = "Editar";
            edit.onclick = async () => {
              openModal(
                "Editar catálogo",
                `<form id="editCatalog" class="grid"><div><label>Código</label><input name="codigo" value="${esc(current.codigo)}" required></div><div><label>Nombre</label><input name="nombre" value="${esc(current.nombre)}" required></div><div class="actions"><button>Guardar</button><button id="cancelEditCatalog" type="button" class="secondary">Cancelar</button></div></form>`,
              );
              $("#cancelEditCatalog").onclick = closeModal;
              $("#editCatalog").onsubmit = async (event) => {
                event.preventDefault();
                const data = Object.fromEntries(new FormData(event.target));
                try {
                  await api(`/api/catalogos/${k}/${current.id}`, {
                    method: "PATCH", body: JSON.stringify(data),
                  });
                  closeModal();
                  await catalogs();
                  message("Catálogo actualizado", true);
                } catch (error) { modalMessage(error.message); }
              };
            };
            cell.append(edit, toggle);
            tr.append(cell);
          });
        };
        $("#catkind").onchange = render;
        render();
      }
      async function tickets() {
        const [data, servicesData, queuesData, config] = await Promise.all([
          api("/api/tickets?size=30"), api("/api/servicios?size=100"), api("/api/colas"), api("/api/service-desk/configuracion")
        ]);
        const opts=(items,label)=>(items||[]).map(x=>`<option value="${x.id}">${esc(x[label]||x.nombre)}</option>`).join("");
        $("#content").innerHTML=`<div class="card"><h2>Service Desk</h2><p>Portal del solicitante y consola de agente. El orden es prioridad y antigüedad.</p>
        <form id="ticketForm" class="grid"><div><label>Título</label><input name="titulo" required minlength="3"></div><div><label>Descripción</label><textarea name="descripcion" required></textarea></div>
        <div><label>Proceso</label><select name="proceso" id="ticketProcess">${Object.keys(config.procesos).map(x=>`<option>${x}</option>`).join("")}</select></div>
        <div><label>Cola</label><select name="cola_id" id="ticketQueue">${opts(queuesData,"nombre")}</select></div><div><label>Servicio</label><select name="servicio_id">${opts(servicesData.items,"codigo")}</select></div>
        <div><label>Prioridad</label><select name="prioridad"><option>baja</option><option selected>media</option><option>alta</option><option>critica</option></select></div>
        <div><label>Impacto</label><select name="impacto"><option>bajo</option><option selected>medio</option><option>alto</option></select></div><div><label>Urgencia</label><select name="urgencia"><option>baja</option><option selected>media</option><option>alta</option></select></div>
        <div id="processFields"></div><div><label>Justificación si no aplica CI</label><input name="sin_ci_justificacion" value="Trámite sin CI identificado" required></div><div class="actions"><button>Crear ticket</button></div></form></div>
        <div class="card"><h2>Tickets visibles</h2><p>${data.total} resultados</p><table><thead><tr><th>Número</th><th>Título</th><th>Proceso</th><th>Cola</th><th>Estado</th><th>Prioridad</th><th></th></tr></thead><tbody>${data.items.map(x=>`<tr><td>${esc(x.numero)}</td><td>${esc(x.titulo)}</td><td>${esc(x.proceso)}</td><td>${esc(x.cola)}</td><td><span class="badge">${esc(x.estado)}</span></td><td>${esc(x.prioridad)}</td><td><button class="secondary ticketDetail" data-id="${x.id}">Ver</button></td></tr>`).join("")}</tbody></table></div>`;
        const processFields=()=>{const p=$("#ticketProcess").value;$("#processFields").innerHTML=p==="eventos"?`<label for="eventCategory">Categoría del evento</label><select id="eventCategory" name="categoria" required><option value="E0">E0 · Programado</option><option value="E1">E1 · No programado sin impacto</option><option value="E2" selected>E2 · No programado con impacto</option><option value="E3">E3 · Seguridad de la información</option></select><label for="eventEvaluation">Evaluación inicial</label><input id="eventEvaluation" name="evaluacion" value="Evento detectado y pendiente de evaluación" required>`:p==="incidentes"?`<label for="incidentCategory">Categoría del incidente</label><select id="incidentCategory" name="categoria" required>${[0,1,2,3,4,5,6].map(i=>`<option value="I${i}">I${i}</option>`).join("")}</select><label for="incidentRedundancy">Redundancia</label><select id="incidentRedundancy" name="redundancia"><option>por_evaluar</option><option>disponible</option><option>no_disponible</option></select>`:""};
        const filterQueues=()=>{$("#ticketQueue").innerHTML=opts(queuesData.filter(x=>x.proceso===$("#ticketProcess").value),"nombre");processFields()};
        $("#ticketProcess").onchange=filterQueues; filterQueues();
        $("#ticketForm").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.cola_id=+d.cola_id;d.servicio_id=+d.servicio_id;d.tipo=config.tipos_por_proceso[d.proceso];d.datos_proceso={};if(d.categoria){d.datos_proceso.categoria=d.categoria;delete d.categoria}if(d.evaluacion){d.datos_proceso.evaluacion=d.evaluacion;delete d.evaluacion}if(d.redundancia){d.datos_proceso.redundancia=d.redundancia;d.datos_proceso.interrupcion=true;d.datos_proceso.justificacion_categoria="Clasificación manual desde el portal";delete d.redundancia}try{await api("/api/tickets",{method:"POST",body:JSON.stringify(d)});message("Ticket creado",true);tickets()}catch(x){message(x.message)}};
        document.querySelectorAll(".ticketDetail").forEach(b=>b.onclick=()=>ticketDetail(+b.dataset.id));
      }
      async function ticketDetail(id) {
        const x=await api(`/api/tickets/${id}`), config=await api("/api/service-desk/configuracion");
        const flow=config.procesos[x.proceso]||[], next=flow[flow.indexOf(x.estado)+1];
        const processData=Object.entries(x.datos_proceso||{}).map(([k,v])=>`<p><b>${esc(k.replaceAll("_"," "))}:</b> ${esc(v)}</p>`).join("");
        const relationsData=(x.relaciones||[]).map(r=>`<p><b>${esc(r.tipo.replaceAll("_"," "))}:</b> ticket #${esc(r.ticket_id===x.id?r.relacionado_id:r.ticket_id)}</p>`).join("");
        $("#content").innerHTML=`<div class="card"><h2>${esc(x.numero)} · ${esc(x.titulo)}</h2><div class="grid"><p><b>Proceso:</b> ${esc(x.proceso)}</p><p><b>Estado:</b> ${esc(x.estado)}</p><p><b>Servicio:</b> ${esc(x.servicio)}</p><p><b>Cola:</b> ${esc(x.cola)}</p><p><b>Responsable:</b> ${esc(x.responsable_id||"Sin asignar")}</p><p><b>CI:</b> ${esc(x.ci_ids.join(", ")||"Justificado sin CI")}</p>${processData}${relationsData}</div><p>${esc(x.descripcion)}</p><div class="actions"><button id="backTickets">Volver</button><button id="claimTicket">Tomar</button>${next?`<button id="nextTicket">Avanzar a ${esc(next)}</button>`:""}</div></div><div class="card"><h3>Bitácora inmutable</h3><table>${x.historial.map(h=>`<tr><td>${esc(h.creado_en)}</td><td>${esc(h.accion)}</td><td>${esc(h.actor_id)}</td><td>${esc(h.motivo||"")}</td></tr>`).join("")}</table></div>`;
        $("#backTickets").onclick=tickets; $("#claimTicket").onclick=async()=>{try{await api(`/api/tickets/${id}/tomar`,{method:"POST"});ticketDetail(id)}catch(e){message(e.message)}};
        if($("#nextTicket"))$("#nextTicket").onclick=async()=>{let datos={};if(x.proceso==="incidentes"&&next==="clasificacion")datos={categoria:"I1",interrupcion:true,redundancia:"por_evaluar",justificacion_categoria:"Clasificación manual"};if(x.proceso==="cambios"&&next==="evaluacion")datos={impacto:"medio",riesgo:"medio",plan_pruebas:"Pendiente de ejecutar",plan_reversion:"Restaurar versión anterior"};try{await api(`/api/tickets/${id}/transiciones`,{method:"POST",body:JSON.stringify({estado:next,datos})});ticketDetail(id)}catch(e){message(e.message)}};
      }
      async function cmdb() {
        const data=await api(`/api/cmdb/dispositivos?size=50&${state.cmdbQuery||""}`),classes=await api("/api/cmdb/clasificaciones");
        $("#content").innerHTML=`<div class="card"><h2>CMDB</h2><form id="cmdbFilter" class="grid"><div><label>Etiqueta, nombre o serie</label><input name="q"></div><div><label>Clasificación</label><select name="clasificacion_id"><option value="">Todas</option>${classes.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join("")}</select></div><div class="actions"><button>Buscar</button></div></form><p>${data.total} dispositivos persistidos</p><table><thead><tr><th>Etiqueta</th><th>Nombre</th><th>Clase</th><th>Estado</th><th>Ubicación</th></tr></thead><tbody>${data.items.map(x=>`<tr><td>${esc(x.etiqueta)}</td><td>${esc(x.nombre)}</td><td>${esc(x.clasificacion)}</td><td>${esc(x.estado)}</td><td>${esc(x.ubicacion)}</td></tr>`).join("")}</tbody></table></div>`;
        $("#cmdbFilter").onsubmit=e=>{e.preventDefault();state.cmdbQuery=new URLSearchParams(new FormData(e.target)).toString();cmdb()};
      }
      async function dashboard(){const x=await api("/api/tablero");const cards=(o)=>Object.entries(o).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("");$("#content").innerHTML=`<div class="card"><h2>Indicadores de atención</h2><p>${esc(x.metodo)}</p><div class="grid"><div><h3>Por proceso</h3><table>${cards(x.por_proceso)}</table></div><div><h3>Por prioridad</h3><table>${cards(x.por_prioridad)}</table></div><div><h3>Por estado</h3><table>${cards(x.por_estado)}</table></div><div><h3>Tiempos</h3><p>Primera atención: ${esc(x.primera_atencion_promedio_min??"—")} min</p><p>Resolución: ${esc(x.resolucion_promedio_min??"—")} min</p></div></div></div>`}
      async function knowledge(){const rows=await api("/api/conocimiento");$("#content").innerHTML=`<div class="card"><h2>Autoservicio · Nivel 0</h2>${rows.map(x=>`<article><h3>${esc(x.titulo)}</h3><p>${esc(x.contenido)}</p><small>${esc(x.etiquetas)}</small></article>`).join("")}</div>`}
      async function queues(){const rows=await api("/api/colas?include_inactive=true"),config=await api("/api/service-desk/configuracion");$("#content").innerHTML=`<div class="card"><h2>Colas</h2><form id="queueForm" class="grid"><div><label>Código</label><input name="codigo" required></div><div><label>Nombre</label><input name="nombre" required></div><div><label>Proceso</label><select name="proceso">${Object.keys(config.procesos).map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>Nivel 0–4</label><input name="nivel_soporte" type="number" min="0" max="4" value="1"></div><div class="actions"><button>Crear</button></div></form><table><thead><tr><th>Código</th><th>Nombre</th><th>Proceso</th><th>Nivel</th><th>Objetivos (min)</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.codigo)}</td><td>${esc(x.nombre)}</td><td>${esc(x.proceso)}</td><td>${x.nivel_soporte}</td><td>${x.objetivo_primera_min}/${x.objetivo_resolucion_min}</td></tr>`).join("")}</tbody></table></div>`;$("#queueForm").onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.nivel_soporte=+d.nivel_soporte;try{await api("/api/colas",{method:"POST",body:JSON.stringify(d)});queues()}catch(x){message(x.message)}}}
      async function imports() {
        let lots = await api("/api/importaciones");
        $("#content").innerHTML =
          `<div class="card"><h2>Importaciones</h2><p>Fuente esperada: <code>data/CatalogoServicios.xlsx</code>.</p>${me.rol === "administrador" ? '<button id="runimp">Importar original</button>' : ""}<table><thead><tr><th>Lote</th><th>SHA-256</th><th>Creados</th><th>Actualizados</th><th>Omitidos</th><th>Observados</th></tr></thead><tbody>${lots.map((x) => `<tr><td>${x.id}</td><td><code>${esc(x.sha256.slice(0, 12))}…</code></td><td>${x.creados}</td><td>${x.actualizados}</td><td>${x.omitidos}</td><td>${x.observados}</td></tr>`).join("")}</tbody></table></div>`;
        if ($("#runimp"))
          $("#runimp").onclick = async () => {
            try {
              let x = await api("/api/importaciones", { method: "POST" });
              message(`Importación completada: ${JSON.stringify(x)}`, true);
              imports();
            } catch (er) {
              message(er.message);
            }
          };
      }
      session();
    </script>
  </body>
</html>
